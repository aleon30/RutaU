<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>RutaU | Publicar un viaje</title>
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/help.css">
    <link rel="stylesheet" href="../css/publish-trip.css">
  </head>
  <body class="help-page publish-trip-page">
    <header class="site-header help-header">
      <a class="brand-mark" href="../index.html" aria-label="RutaU, volver al inicio">
        <img src="../assets/ruta-u-mark.png" alt="">
      </a>
      <a class="help-link" href="ayuda.html" aria-label="Centro de ayuda">
        <img src="../assets/logo-icon.svg" alt="">
      </a>
      <nav class="help-nav" aria-label="Navegación principal">
        <a class="button button-primary" href="buscar_viaje.html">Buscar viaje</a>
        <a class="button button-primary" href="viajes_planeados.html">Viajes planeados</a>
        <a class="button button-primary" href="publicar_viaje.html" aria-current="page">Publicar viaje</a>
      </nav>
      <div class="help-user-actions">
        <a class="help-notifications" href="notificaciones.html" aria-label="Notificaciones">
          <img src="../assets/help-bell.svg" alt="">
        </a>
        <span class="help-greeting">¡Hola, Paula!</span>
        <a class="help-avatar" href="perfil.html" aria-label="Ver perfil de Paula">
          <img src="../assets/help-user-avatar.png" alt="">
        </a>
      </div>
    </header>

    <main class="publish-main">
      <h1 class="publish-title">Publica tu viaje</h1>

      <form class="publish-form" id="publish-form" novalidate>
        <div class="publish-form-card">
          <div class="publish-fields">
            <div class="publish-field">
              <label for="vehicle-model">Modelo del vehículo</label>
              <input
                id="vehicle-model"
                name="vehicleModel"
                type="text"
                placeholder="Ejm: TOYOTA"
                required
                aria-invalid="false"
              >
            </div>

            <div class="publish-field">
              <label for="vehicle-plate">Placa</label>
              <input
                id="vehicle-plate"
                name="vehiclePlate"
                type="text"
                placeholder="Ejm: MK3-O67"
                required
                aria-invalid="false"
              >
            </div>

            <div class="publish-field">
              <label for="trip-origin">Punto de partida</label>
              <input
                id="trip-origin"
                name="origin"
                type="text"
                placeholder="Ejm: Mz Aw Lote"
                required
                aria-invalid="false"
              >
            </div>

            <div class="publish-field">
              <label for="trip-destination">Destino</label>
              <input
                id="trip-destination"
                name="destination"
                type="text"
                placeholder="Ejm: Monterrico"
                required
                aria-invalid="false"
              >
            </div>

            <div class="publish-field">
              <label for="trip-time">Hora de salida</label>
              <input
                id="trip-time"
                name="departureTime"
                type="text"
                placeholder="Ejm: 12:00 PM"
                pattern="(0?[1-9]|1[0-2]):[0-5][0-9]\s?(AM|PM)"
                title="Ingresa la hora en formato de 12 horas, por ejemplo 12:00 PM."
                required
                aria-invalid="false"
              >
            </div>

            <div class="publish-field-row">
              <div class="publish-field">
                <label for="available-seats">Asientos</label>
                <input
                  id="available-seats"
                  name="availableSeats"
                  type="number"
                  min="1"
                  step="1"
                  placeholder="Ejm: 5"
                  required
                  aria-invalid="false"
                >
              </div>
              <div class="publish-field">
                <label for="seat-price">Precio por asiento</label>
                <input
                  id="seat-price"
                  name="seatPrice"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="Ejm: S/ 10 - S/ 100"
                  required
                  aria-invalid="false"
                >
              </div>
            </div>
          </div>

          <label class="publish-terms" for="accept-terms">
            <input id="accept-terms" name="acceptTerms" type="checkbox" required>
            <span>Acepto los Terminos y condiciones</span>
          </label>
        </div>

        <div class="publish-actions">
          <button class="publish-cancel-button" type="reset">Cancelar</button>
          <button class="publish-submit-button" type="submit">Publicar</button>
        </div>
        <p class="publish-status" id="publish-status" role="status" hidden>
          Tu viaje fue publicado correctamente.
        </p>
      </form>
    </main>

    <script>
      const publishForm = document.getElementById('publish-form');
      const publishStatus = document.getElementById('publish-status');
      const publishFields = [...publishForm.querySelectorAll('input:not([type="checkbox"])')];

      publishFields.forEach((field) => {
        field.addEventListener('input', () => {
          field.setAttribute('aria-invalid', String(!field.checkValidity()));
          publishStatus.hidden = true;
        });
      });

      publishForm.querySelector('#accept-terms').addEventListener('change', () => {
        publishStatus.hidden = true;
      });

      publishForm.addEventListener('reset', () => {
        publishStatus.hidden = true;
        publishFields.forEach((field) => {
          field.setAttribute('aria-invalid', 'false');
        });
      });

      publishForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const valid = publishForm.checkValidity();
        publishFields.forEach((field) => {
          field.setAttribute('aria-invalid', String(!field.checkValidity()));
        });

        if (!valid) {
          publishForm.reportValidity();
          return;
        }

        publishForm.reset();
        publishStatus.hidden = false;
      });
    </script>
  </body>
</html>
