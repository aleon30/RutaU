    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/styles.css">
  </head>
  <body class="site-page" id="site-page">
    <header class="site-header help-header" id="site-header">
      <a class="brand-mark" id="brand-mark" href="../../index.html" aria-label="RutaU, volver al inicio">
        <img src="../../img/ruta-u-mark.png" alt="">
      </a>
      <a class="help-link" id="help-link" href="../help/ayuda.html" aria-label="Centro de ayuda">
        <img src="../../img/logo-icon.svg" alt="">
      </a>
      <a class="mobile-menu-toggle" id="mobile-menu-toggle" href="../menu.html" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </a>
      <nav class="help-nav" id="help-nav" aria-label="Navegación principal">
        <a class="button button-primary" href="buscar_viaje.html">Buscar viaje</a>
        <a class="button button-primary" href="viajes_planeados.html">Viajes planeados</a>
        <a class="button button-primary" href="publicar_viaje.html" aria-current="page">Publicar viaje</a>
      </nav>
      <div class="help-user-actions" id="help-user-actions">
        <a class="help-notifications" id="help-notifications" href="../user/notificaciones.html" aria-label="Notificaciones">
          <img src="../../img/help-bell.svg" alt="">
        </a>

        </a>
      </div>
    </header>

    <main class="publish-main" id="publish-main">
      <h1 class="page-title publish-title">Publicar viaje</h1>

      <form class="publish-card card" id="trip-publish-form">
        <div class="publish-form-grid">
          <div class="publish-field">
            <label class="form-label" for="trip-origin">Lugar de salida</label>
            <input class="form-control" id="trip-origin" name="origin" type="text" placeholder="Ej. UPC Monterrico" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-destination">Destino</label>
            <input class="form-control" id="trip-destination" name="destination" type="text" placeholder="Ej. Miraflores" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-date">Fecha</label>
            <input class="form-control" id="trip-date" name="date" type="date" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-seats">Asientos disponibles</label>
            <input class="form-control" id="trip-seats" name="seats" type="number" min="1" step="1" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-departure-time">Hora de salida</label>
            <input class="form-control" id="trip-departure-time" name="departureTime" type="time" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-arrival-time">Hora estimada de llegada</label>
            <input class="form-control" id="trip-arrival-time" name="arrivalTime" type="time" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-price">Precio por asiento (S/)</label>
            <input class="form-control" id="trip-price" name="price" type="number" min="0.01" step="0.01" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-driver-name">Nombre del conductor</label>
            <input class="form-control" id="trip-driver-name" name="driverName" type="text" autocomplete="name" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-university">Universidad</label>
            <input class="form-control" id="trip-university" name="university" type="text" value="UPC" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-vehicle-model">Modelo del carro</label>
            <input class="form-control" id="trip-vehicle-model" name="vehicleModel" type="text" placeholder="Ej. Toyota Corolla" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-vehicle-color">Color del carro</label>
            <input class="form-control" id="trip-vehicle-color" name="vehicleColor" type="text" placeholder="Ej. Blanco" required>
          </div>
          <div class="publish-field">
            <label class="form-label" for="trip-license-plate">Placa</label>
            <input class="form-control" id="trip-license-plate" name="licensePlate" type="text" placeholder="Ej. ABC-123" required>
          </div>
          <button class="publish-submit" type="submit">Publicar viaje</button>
        </div>
      </form>
    </main>

    <script src="../../js/localstorage.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/trips.js"></script>
  </body>
</html>
