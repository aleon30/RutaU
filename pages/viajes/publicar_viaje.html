<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>RutaU | Publicar un viaje</title>
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/styles.css">
  </head>
  <body class="site-page" id="site-page">
    <header class="site-header help-header" id="site-header">
      <a class="brand-mark" id="brand-mark" href="../../index.html" aria-label="RutaU, volver al inicio">
        <img src="../../img/ruta-u-mark.png" alt="">
      </a>
      <a class="help-link" id="help-link" href="../help/ayuda.html" aria-label="Centro de ayuda">
        <img src="../../img/logo-icon.svg" alt="">
      </a>
      <a class="mobile-menu-toggle" id="mobile-menu-toggle" href="../menu.html" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </a>
      <nav class="help-nav" id="help-nav" aria-label="Navegación principal">
        <a class="button button-primary" href="../viajes/buscar_viaje.html">Buscar viaje</a>
        <a class="button button-primary" href="../viajes/viajes_planeados.html">Viajes planeados</a>
        <a class="button button-primary" href="publicar_viaje.html" aria-current="page">Publicar viaje</a>
      </nav>
      <div class="help-user-actions" id="help-user-actions">
        <a class="help-notifications" id="help-notifications" href="../user/notificaciones.html" aria-label="Notificaciones">
          <img src="../../img/help-bell.svg" alt="">
        </a>
        <span class="help-greeting">¡Hola, Paula!</span>
        <a class="help-avatar" id="help-avatar" href="../user/perfil.html" aria-label="Ver perfil de Paula">
          <img src="../../img/help-user-avatar.png" alt="">
        </a>
      </div>
    </header>

    <main class="publish-main">
      <h1 class="page-title publish-title">Publica tu viaje</h1>

      <form class="publish-form" id="publish-form" novalidate>
        <div class="publish-form-card card" id="publish-form-card">
          <div class="publish-fields" id="publish-fields">
            <div class="publish-field">
              <label class="form-label" for="vehicle-model">Modelo del vehículo</label>
              <input
                class="form-control"
                id="vehicle-model"
                name="vehicleModel"
                type="text"
                placeholder="Ejm: TOYOTA"
                required
                aria-invalid="false"
              >
            </div>

            <div class="publish-field">
              <label class="form-label" for="vehicle-plate">Placa</label>
              <input
                class="form-control"
                id="vehicle-plate"
                name="vehiclePlate"
                type="text"
                placeholder="Ejm: MK3-O67"
                required
                aria-invalid="false"
              >
            </div>

            <div class="publish-field">
              <label class="form-label" for="trip-origin">Punto de partida</label>
              <input
                class="form-control"
                id="trip-origin"
                name="origin"
                type="text"
                placeholder="Ejm: Mz Aw Lote"
                required
                aria-invalid="false"
              >
            </div>

            <div class="publish-field">
              <label class="form-label" for="trip-destination">Destino</label>
              <input
                class="form-control"
                id="trip-destination"
                name="destination"
                type="text"
                placeholder="Ejm: Monterrico"
                required
                aria-invalid="false"
              >
            </div>

            <div class="publish-field">
              <label class="form-label" for="trip-time">Hora de salida</label>
              <input
                class="form-control"
                id="trip-time"
                name="departureTime"
                type="text"
                placeholder="Ejm: 12:00 PM"
                pattern="(0?[1-9]|1[0-2]):[0-5][0-9]\s?(AM|PM)"
                title="Ingresa la hora en formato de 12 horas, por ejemplo 12:00 PM."
                required
                aria-invalid="false"
              >
            </div>

            <div class="publish-field-row" id="publish-field-row">
              <div class="publish-field">
                <label class="form-label" for="available-seats">Asientos</label>
                <input
                  class="form-control"
                  id="available-seats"
                  name="availableSeats"
                  type="number"
                  min="1"
                  step="1"
                  placeholder="Ejm: 5"
                  required
                  aria-invalid="false"
                >
              </div>
              <div class="publish-field">
                <label class="form-label" for="seat-price">Precio por asiento</label>
                <input
                  class="form-control"
                  id="seat-price"
                  name="seatPrice"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="Ejm: S/ 10 - S/ 100"
                  required
                  aria-invalid="false"
                >
              </div>
            </div>
          </div>

          <label class="publish-terms" id="publish-terms" for="accept-terms">
            <input id="accept-terms" name="acceptTerms" type="checkbox" required>
            <span>Acepto los Terminos y condiciones</span>
          </label>
        </div>

        <div class="publish-actions" id="publish-actions">
          <button class="publish-cancel-button" id="publish-cancel-button" type="reset">Cancelar</button>
          <button class="publish-submit-button" id="publish-submit-button" type="submit">Publicar</button>
        </div>
        <p class="publish-status" id="publish-status" role="status" hidden>
          Tu viaje fue publicado correctamente.
        </p>
      </form>
    </main>

  </body>
</html>
