<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>RutaU | Buscar viaje</title>
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/styles.css">
  </head>
  <body class="site-page" id="site-page">
    <header class="site-header help-header" id="site-header">
      <a class="brand-mark" id="brand-mark" href="../../index.html" aria-label="RutaU, volver al inicio">
        <img src="../../img/ruta-u-mark.png" alt="">
      </a>
      <a class="help-link" id="help-link" href="../help/ayuda.html" aria-label="Centro de ayuda">
        <img src="../../img/logo-icon.svg" alt="">
      </a>
      <a class="mobile-menu-toggle" id="mobile-menu-toggle" href="../menu.html" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </a>
      <nav class="help-nav" id="help-nav" aria-label="Navegación principal">
        <a class="button button-primary" href="buscar_viaje.html" aria-current="page">Buscar viaje</a>
        <a class="button button-primary" href="viajes_planeados.html">Viajes planeados</a>
        <a class="button button-primary" href="publicar_viaje.html">Publicar viaje</a>
      </nav>
      <div class="help-user-actions" id="help-user-actions">
        <a class="help-notifications" id="help-notifications" href="../user/notificaciones.html" aria-label="Notificaciones">
          <img src="../../img/help-bell.svg" alt="">
        </a>
        <span class="help-greeting">¡Hola, Paula!</span>
        <a class="help-avatar" id="help-avatar" href="../user/perfil.html" aria-label="Ver perfil de Paula">
          <img src="../../img/help-user-avatar.png" alt="">
        </a>
      </div>
    </header>

    <main class="search-main">
      <h1 class="page-title search-title" id="search-title">Buscar viaje</h1>

      <div class="search-layout" id="search-layout">
        <aside class="search-filter" aria-label="Filtros de viaje">
          <button class="filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="trip-filters">
            <span>Filtrar viaje</span>
            <span class="filter-chevron" id="filter-chevron" aria-hidden="true"></span>
          </button>
          <form class="filter-form" id="trip-filters" hidden>
            <div class="filter-field">
              <label class="form-label" for="filter-origin">Desde</label>
              <input id="filter-origin" name="origin" type="text" placeholder="Lugar de salida">
            </div>
            <div class="filter-field">
              <label class="form-label" for="filter-destination">Hacia</label>
              <input id="filter-destination" name="destination" type="text" placeholder="Destino">
            </div>
            <div class="filter-field">
              <label class="form-label" for="filter-date">Fecha</label>
              <input id="filter-date" name="date" type="date">
            </div>
            <div class="filter-field">
              <label class="form-label" for="filter-time">Hora</label>
              <input id="filter-time" name="time" type="text" placeholder="--:--">
            </div>
            <div class="filter-field">
              <label class="form-label" for="filter-seats">Asientos</label>
              <input id="filter-seats" name="seats" type="number" min="1" placeholder="1">
            </div>
            <div class="filter-field">
              <label class="form-label" for="filter-price">Precio</label>
              <input id="filter-price" name="price" type="text" placeholder="1 - 10 S/">
            </div>
            <button class="filter-submit" id="filter-submit" type="submit">
              <img src="../../img/trip-search.svg" alt="">
              <span>Buscar</span>
            </button>
            <p class="filter-status" aria-live="polite" hidden></p>
          </form>
        </aside>

        <section class="search-results" id="search-results" aria-label="Resultados de búsqueda">
          <p class="search-empty-state" id="search-empty-state" hidden>No hay viajes que coincidan con los filtros.</p>
        </section>
      </div>
    </main>

    <script src="../../js/localstorage.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/trips.js"></script>
  </body>
</html>
