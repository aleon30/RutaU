<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>RutaU | Iniciar sesión</title>
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login.css">
  </head>
  <body class="login-page">
    <main class="login-main">
      <a class="login-logo" href="../index.html" aria-label="RutaU, volver al inicio">
        <img src="../assets/login-rutau-logo.png" alt="RutaU">
      </a>

      <form class="login-form" data-validate="true" novalidate>
        <div class="login-field">
          <label for="login-email">Email</label>
          <input
            id="login-email"
            name="email"
            type="email"
            required
            aria-invalid="false"
            placeholder="Ejm: u002002@upc.edu.pe"
            autocomplete="username">
          <span class="login-field-error" aria-live="polite"></span>
        </div>

        <div class="login-field login-field--password">
          <label for="login-password">Password</label>
          <input
            id="login-password"
            name="password"
            type="password"
            required
            aria-invalid="false"
            placeholder="Ejm: Carlitos6714"
            autocomplete="current-password">
          <span class="login-field-error" aria-live="polite"></span>
        </div>

        <label class="remember-option" for="login-remember">
          <input id="login-remember" name="remember" type="checkbox" checked>
          <span>Recuérdame</span>
        </label>

        <a class="forgot-password" href="ayuda.html">Olvidé mi contraseña</a>

        <div class="login-actions">
          <button class="login-submit" type="submit">Iniciar sesión</button>
          <a class="login-home" href="../index.html">Volver al inicio</a>
        </div>

        <p class="login-status" aria-live="polite"></p>
      </form>

      <a class="create-account" href="registro.html">Crear cuenta</a>
    </main>

    <script>
      const loginForm = document.querySelector('.login-form');
      const loginStatus = document.querySelector('.login-status');

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        let isValid = true;

        loginForm.querySelectorAll('.login-field').forEach((field) => {
          const input = field.querySelector('input');
          const error = field.querySelector('.login-field-error');
          const value = input.value.trim();
          let message = '';

          if (!value) {
            message = 'Este campo es obligatorio.';
          } else if (input.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
            message = 'Ingresa un correo válido.';
          }

          input.setAttribute('aria-invalid', String(Boolean(message)));
          error.textContent = message;
          isValid = isValid && !message;
        });

        if (!isValid) {
          loginStatus.textContent = 'Revisa los datos antes de continuar.';
          loginStatus.classList.remove('success');
          return;
        }

        loginStatus.textContent = 'Inicio de sesión correcto.';
        loginStatus.classList.add('success');
        loginForm.reset();
      });
    </script>
  </body>
</html>
