<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>RutaU | Registro</title>
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/register.css">
  </head>
  <body class="register-page">
    <main class="register-main">
      <a class="register-logo" href="../../index.html" aria-label="RutaU, volver al inicio">
        <img src="../../img/register-rutau-logo.png" alt="RutaU">
      </a>

      <form class="register-form" id="register-form" novalidate>
        <div class="register-card">
          <div class="register-fields">
            <div class="register-field">
              <label for="register-first-name">Nombres</label>
              <input
                id="register-first-name"
                name="firstName"
                type="text"
                placeholder="Ejm: Camilo"
                autocomplete="given-name"
                required
                aria-invalid="false"
              >
            </div>

            <div class="register-field">
              <label for="register-last-name">Apellidos</label>
              <input
                id="register-last-name"
                name="lastName"
                type="text"
                placeholder="Ejm: Calderon"
                autocomplete="family-name"
                required
                aria-invalid="false"
              >
            </div>

            <div class="register-field">
              <label for="register-dni">DNI</label>
              <input
                id="register-dni"
                name="dni"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{8}"
                minlength="8"
                maxlength="8"
                placeholder="Ejm: 62345198"
                required
                aria-invalid="false"
              >
            </div>

            <div class="register-field">
              <label for="register-phone">Teléfono</label>
              <input
                id="register-phone"
                name="phone"
                type="tel"
                inputmode="tel"
                pattern="9[0-9]{2}\s?[0-9]{3}\s?[0-9]{3}"
                placeholder="Ejm: 999 555 444"
                autocomplete="tel"
                required
                aria-invalid="false"
              >
            </div>

            <div class="register-field">
              <label for="register-email">Correo universitario</label>
              <input
                id="register-email"
                name="email"
                type="email"
                placeholder="Ejm: u002002@upc.edu.pe"
                autocomplete="email"
                required
                aria-invalid="false"
                aria-describedby="register-email-error"
              >
              <span class="register-field-error" id="register-email-error">
                Usa tu correo institucional de UPC, ULima o PUCP.
              </span>
            </div>

            <div class="register-field">
              <label for="register-password">Contraseña</label>
              <input
                id="register-password"
                name="password"
                type="password"
                minlength="8"
                placeholder="Ejm: Carlitos6714"
                autocomplete="new-password"
                required
                aria-invalid="false"
              >
            </div>
          </div>

          <label class="register-terms" for="register-terms">
            <input
              id="register-terms"
              name="terms"
              type="checkbox"
              required
              aria-invalid="false"
            >
            <span>Acepto los Terminos y condiciones</span>
          </label>
        </div>

        <button class="register-submit" type="submit">Registrarse</button>
        <p class="register-status" id="register-status" role="status" hidden></p>
      </form>
    </main>

  </body>
</html>
